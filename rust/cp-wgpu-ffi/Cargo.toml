[package]
name = "cp-wgpu-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI: Quantus wgpu GpuEngine for CPPminer"
publish = false

[lib]
name = "cp_wgpu_ffi"
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
engine-gpu = { path = "../../third_party/quantus-miner/crates/engine-gpu" }
engine-cpu = { path = "../../third_party/quantus-miner/crates/engine-cpu" }
pow-core = { path = "../../third_party/quantus-miner/crates/pow-core" }
primitive-types = { version = "0.13.1", default-features = false }
parking_lot = "0.12"
log = "0.4"
